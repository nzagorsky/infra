# Inspo: https://nerdiverset.no/k8s-native-sidecar-with-vpn/
apiVersion: v1
kind: Namespace
metadata:
  name: media

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: transmission-vpn
  namespace: media
spec:
  replicas: 1
  selector:
    matchLabels:
      app: transmission
  template:
    metadata:
      labels:
        app: transmission
    spec:
      volumes:
        # Required for Wireguard tunnel device in many setups
        - name: tun
          hostPath:
            path: /dev/net/tun
            type: CharDevice
        - name: transmission-config
          persistentVolumeClaim:
            claimName: transmission-config
        - name: synology-media-nfs
          persistentVolumeClaim:
            claimName: synology-media-nfs

      initContainers:
        - name: gluetun
          image: qmcgaw/gluetun:v3.41.1
          restartPolicy: Always
          securityContext:
            privileged: true
            capabilities:
              add: ["NET_ADMIN"]
          env:
            - name: VPN_SERVICE_PROVIDER
              value: "protonvpn"
            - name: VPN_TYPE
              value: "wireguard"
            - name: WIREGUARD_PRIVATE_KEY
              valueFrom:
                secretKeyRef:
                  name: gluetun-secret
                  key: WIREGUARD_PRIVATE_KEY
            - name: UPDATER_PERIOD
              value: "24h"
            - name: PORT_FORWARD_ONLY
              value: "on"
            - name: VPN_PORT_FORWARDING
              value: "on"
            - name: VPN_PORT_FORWARDING_PROVIDER
              value: "protonvpn"
            - name: VPN_PORT_FORWARDING_UP_COMMAND
              value: >-
                /bin/sh -c 'i=0; while [ "$i" -lt 60 ]; do i=$((i+1)); SID=$(wget -S -O- --post-data "{\"method\":\"session-get\"}" http://127.0.0.1:9091/transmission/rpc 2>&1 | sed -n "s/^  X-Transmission-Session-Id: //p" | tr -d "\r\n"); if [ -n "$SID" ]; then wget -qO- --header="X-Transmission-Session-Id: $SID" --post-data "{\"method\":\"session-set\",\"arguments\":{\"peer-port\":{{PORT}},\"peer-port-random-on-start\":false,\"port-forwarding-enabled\":true}}" http://127.0.0.1:9091/transmission/rpc && exit 0; fi; sleep 2; done; echo "failed to sync forwarded port to transmission" >&2; exit 1'
            - name: DNS_ADDRESS
              value: "1.1.1.1"
          ports:
            - name: http-proxy
              containerPort: 8888
              protocol: TCP
        - name: ping
          image: busybox:1.37.0
          command:
            - sh
            - -c
            - |
              while ! ping -c 1 1.1.1.1; do
                echo "Ping failed, retrying in 5"
                sleep 5
              done
              echo "ping succesfull, exiting"
      containers:
        - name: curlpod
          image: curlimages/curl:8.18.0
          args:
            - /bin/sh
            - -c
            - while true; do curl -s 4.ident.me; echo; sleep 15; done
          imagePullPolicy: Always

        - name: gluetun-rotator
          image: curlimages/curl:8.18.0
          args:
            - /bin/sh
            - -c
            - |
              while true; do
                sleep 43200
                curl -fsS -X PUT -H "Content-Type: application/json" -d '{"status":"stopped"}' http://127.0.0.1:8000/v1/vpn/status >/dev/null || true
                sleep 5
                curl -fsS -X PUT -H "Content-Type: application/json" -d '{"status":"running"}' http://127.0.0.1:8000/v1/vpn/status >/dev/null || true
              done
          imagePullPolicy: Always

        - name: transmission
          image: linuxserver/transmission:4.1.1
          env:
            - name: DOCKER_MODS
              value: "linuxserver/mods:transmission-floodui"
            - name: PUID
              value: "1001"
            - name: PGID
              value: "1001"
            - name: UMASK
              value: "022"
            - name: TZ
              value: "UTC"
          ports:
            - name: webui
              containerPort: 9091
              protocol: TCP
          volumeMounts:
            - name: transmission-config
              mountPath: /config
            - name: synology-media-nfs
              mountPath: /media
            - name: synology-media-nfs
              mountPath: /downloads
          readinessProbe:
            tcpSocket:
              port: 9091
            initialDelaySeconds: 5
            periodSeconds: 10
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: transmission-config
  namespace: media
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 2Gi
  storageClassName: nfs-storage

---
apiVersion: v1
kind: Service
metadata:
  name: transmission
  namespace: media
  labels:
    app: transmission
spec:
  selector:
    app: transmission
  ports:
    - name: http
      port: 9091
      targetPort: 9091
      protocol: TCP
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: transmission
  namespace: media
spec:
  ingressClassName: traefik
  tls:
    - hosts:
        - transmission.home.${BASE_DOMAIN:=example.com}
      secretName: wildcard-home-tls
  rules:
    - host: transmission.home.${BASE_DOMAIN:=example.com}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: transmission
                port:
                  number: 9091
