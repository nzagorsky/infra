services:
  cloudflare_ddns:
    image: oznu/cloudflare-ddns:latest
    container_name: cloudflare_ddns
    restart: unless-stopped
    network_mode: host
    environment:
      TZ: UTC
      API_KEY: ${CLOUDFLARE_DDNS_KEY:?Error Set cloudflare token}
      ZONE: ${BASE_DOMAIN:?Set base domain}
      SUBDOMAIN: "db.lab"
      PROXIED: "false"
      RRTYPE: A
      CUSTOM_LOOKUP_CMD: "ip route get 1.1.1.1 | awk '{print $7; exit}'"

  postgres:
    image: "postgres:18.3"
    container_name: postgres
    restart: unless-stopped
    ports:
      - 5432:5432
    environment:
      - "POSTGRES_DB=postgres"
      - "POSTGRES_USER=postgres"
      - "POSTGRES_PASSWORD=postgres"
    volumes:
      - postgres_data:/var/lib/postgresql

  opensearch:
    image: opensearchproject/opensearch:3.7.0
    container_name: opensearch
    restart: unless-stopped
    ports:
      - 9200:9200
      - 9600:9600
    environment:
      - discovery.type=single-node
      - bootstrap.memory_lock=true
      - OPENSEARCH_JAVA_OPTS=-Xms512m -Xmx512m
      - DISABLE_SECURITY_PLUGIN=true
    ulimits:
      memlock:
        soft: -1
        hard: -1
      nofile:
        soft: 65536
        hard: 65536
    volumes:
      - opensearch_data:/usr/share/opensearch/data

  opensearch-dashboards:
    image: opensearchproject/opensearch-dashboards:3.7.0
    container_name: opensearch-dashboards
    restart: unless-stopped
    depends_on:
      - opensearch
    environment:
      - OPENSEARCH_HOSTS=["http://opensearch:9200"]
      - DISABLE_SECURITY_DASHBOARDS_PLUGIN=true
      - SERVER_HOST=0.0.0.0

  caddy:
    image: ghcr.io/caddy-dns/cloudflare:latest
    container_name: caddy
    restart: unless-stopped
    depends_on:
      - opensearch-dashboards
    ports:
      - 80:80
      - 443:443
    environment:
      ACME_EMAIL: ${ACME_EMAIL:?Error Set ACME email}
      CF_API_TOKEN: ${CLOUDFLARE_DDNS_KEY:?Error Set cloudflare token}
    volumes:
      - caddy_data:/data
      - caddy_config:/config
    configs:
      - source: caddyfile
        target: /etc/caddy/Caddyfile

volumes:
  postgres_data:
    driver: local
    name: postgres_data
  opensearch_data:
    driver: local
    name: opensearch_data
  caddy_data:
    driver: local
    name: caddy_data
  caddy_config:
    driver: local
    name: caddy_config

configs:
  caddyfile:
    content: |
      {
        email $ACME_EMAIL
      }

      db.lab.${BASE_DOMAIN:?Set base domain} {
        tls {
          dns cloudflare {env.CF_API_TOKEN}
          resolvers 1.1.1.1
        }

        reverse_proxy opensearch-dashboards:5601
      }
